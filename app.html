<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>PokeDream Launcher</title>
<style>
  /* =========================================================================
     Poke Dream Launcher — sistema visual "Dex Console"
     Tokens -> primitivas (btn / chip / card / tile / badge / tip) -> painéis.
     Nenhum template usa cor solta: tudo sai das variáveis desta seção.
     ========================================================================= */
  :root{
    /* superfícies */
    --bg:#080b11; --shell:#0b0f16; --panel:#111825; --panel2:#161e2d; --panel3:#1d2637;
    --line:#1d2534; --line2:#2a3548; --line3:#3a4761;
    /* texto */
    --txt:#e8ebf2; --txt2:#b6c0d1; --mut:#818ca1; --dim:#5c6779;
    /* acentos */
    --gold:#ffce56; --gold-soft:#3a2f10; --gold-line:#5d4a17;
    --good:#41d17f; --good-soft:#0f2419; --good-line:#26543a;
    --warn:#ffb151; --warn-soft:#2a1d0d; --warn-line:#5b421f;
    --bad:#ff6b71; --bad-soft:#2a1317; --bad-line:#6b2830;
    --info:#7fb4ff; --info-soft:#121d2e; --info-line:#2c4568;
    /* formas */
    --r-sm:7px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px;
    --sh-1:0 1px 2px rgba(0,0,0,.35);
    --sh-2:0 8px 22px rgba(0,0,0,.32);
    --sh-3:0 22px 60px rgba(0,0,0,.55);
    --ease:cubic-bezier(.22,.61,.36,1);
    /* compat com nomes antigos usados em templates herdados */
    --panel4:#212b3e;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:
      radial-gradient(1200px 600px at 78% -10%, rgba(255,206,86,.05), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(127,180,255,.045), transparent 60%),
      var(--bg);
    color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased; color-scheme:dark; overflow:hidden;
  }
  .app{ display:flex; flex-direction:column; height:100vh; }
  button{ font-family:inherit; cursor:pointer; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#222c3d; border:2px solid transparent; background-clip:padding-box; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:#31405a; background-clip:padding-box; }
  ::-webkit-scrollbar-track{ background:transparent; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }

  /* ---------- primitivas ---------- */
  .tbtn, .navbtn, .ico, .sbtn, .gcbtn, .addacc{ transition:background .14s var(--ease), border-color .14s var(--ease), color .14s var(--ease); }
  .u-mono{ font-variant-numeric:tabular-nums; }
  .u-ell{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- barra de abas (topo, arrastável) ---------- */
  .tabbar{ height:36px; flex:0 0 36px; display:flex; align-items:center; gap:6px; padding:0 8px;
    background:linear-gradient(180deg,#0a0e15,#080b11); border-bottom:1px solid var(--line);
    -webkit-app-region:drag; z-index:22; }
  .tabs{ display:flex; align-items:end; align-self:stretch; gap:3px; min-width:0; overflow:hidden; -webkit-app-region:no-drag; }
  .site-tab{ height:30px; min-width:120px; max-width:196px; margin-top:6px; padding:0 6px 0 10px; display:flex; align-items:center; gap:7px;
    border:1px solid transparent; border-bottom:0; border-radius:9px 9px 0 0; background:transparent; color:var(--mut);
    font-size:11.5px; cursor:pointer; transition:background .14s var(--ease), color .14s var(--ease); }
  .site-tab:hover{ background:var(--panel); color:var(--txt2); }
  .site-tab.on{ background:var(--panel2); color:var(--txt); border-color:var(--line2); box-shadow:inset 0 2px 0 var(--gold); }
  .site-tab.dragging{ opacity:.45; }
  .site-tab.drag-over{ box-shadow:-2px 0 0 var(--gold); }
  .site-tab .fav{ width:14px; height:14px; flex:0 0 14px; border-radius:3px; object-fit:contain; }
  .site-tab .tab-dot{ width:9px; height:9px; flex:0 0 9px; border-radius:50%;
    background:radial-gradient(circle at 50% 32%, #fff 0 22%, var(--gold) 23% 48%, #16181d 49% 58%, #cfd4de 59%); }
  .site-tab .label{ min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .site-tab .count{ color:var(--dim); font-size:9px; font-variant-numeric:tabular-nums; }
  .site-tab .tab-close{ width:18px; height:18px; padding:0; border:0; border-radius:5px; background:transparent; color:var(--dim); font-size:12px; }
  .site-tab .tab-close:hover{ background:var(--bad-soft); color:var(--bad); }
  .new-tab{ width:30px; height:26px; flex:0 0 30px; border:1px solid var(--line2); border-radius:var(--r-sm); background:transparent; color:var(--mut); font-size:17px; line-height:1; -webkit-app-region:no-drag; }
  .new-tab:hover{ color:var(--gold); border-color:var(--gold-line); background:var(--gold-soft); }
  .new-tab:disabled{ opacity:.3; cursor:not-allowed; }
  .tabbar .sp{ flex:1; }
  .tabbar .ico{ -webkit-app-region:no-drag; }

  /* ---------- barra de ferramentas ---------- */
  .bar{ height:46px; flex:0 0 46px; display:flex; align-items:center; gap:10px; padding:0 8px 0 10px;
    background:linear-gradient(180deg,var(--panel),#0e131d); border-bottom:1px solid var(--line); -webkit-app-region:drag; z-index:20; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.4px; font-size:12.5px; }
  .brand .logo{ width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 50% 33%, #fff 0 24%, var(--gold) 25% 47%, #14161b 48% 56%, #e2e6ee 57%);
    box-shadow:0 0 0 1.5px #14161b inset, 0 0 12px rgba(255,206,86,.25); }
  .brand b{ color:var(--gold); }
  .ver{ font-size:10px; font-weight:700; color:var(--mut); background:var(--panel2); border:1px solid var(--line2); padding:2px 7px; border-radius:var(--r-pill); letter-spacing:0; }
  .bar .sp{ flex:1; }
  .bar button{ -webkit-app-region:no-drag; }
  .dream-tools{ display:flex; align-items:center; gap:4px; padding:3px; border:1px solid var(--line); border-radius:var(--r-md); background:rgba(8,11,17,.55); }
  .generic-tools{ display:none; align-items:center; gap:7px; min-width:0; flex:1; -webkit-app-region:no-drag; }
  body.generic-active .dream-brand, body.generic-active .dream-tools{ display:none; }
  body.generic-active .generic-tools{ display:flex; }
  .navbtn{ width:30px; height:30px; border:1px solid var(--line2); border-radius:var(--r-sm); background:var(--panel2); color:var(--txt); font-size:14px; }
  .navbtn:hover{ background:var(--panel3); }
  .navbtn:disabled{ color:#48526448; color:var(--dim); opacity:.5; cursor:not-allowed; }
  .address-form{ flex:1; min-width:130px; display:flex; }
  .address{ width:100%; height:30px; padding:0 12px; border:1px solid var(--line2); border-radius:var(--r-pill); outline:none; background:#0a0e16; color:var(--txt); font:11.5px "Segoe UI",system-ui,sans-serif; }
  .address:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,206,86,.13); }
  .tbtn{ height:30px; padding:0 11px; display:flex; align-items:center; gap:6px; border-radius:var(--r-sm);
    border:1px solid transparent; background:transparent; color:var(--txt2); font-size:12px; font-weight:600; white-space:nowrap; }
  .tbtn:hover{ background:var(--panel3); color:var(--txt); }
  .tbtn.on{ background:var(--gold-soft); border-color:var(--gold-line); color:var(--gold); }
  .bar > .tbtn{ border-color:var(--line2); background:var(--panel2); }
  .bar > .tbtn:hover{ background:var(--panel3); }
  .ico{ width:32px; height:28px; border:1px solid transparent; background:transparent; color:var(--mut); border-radius:var(--r-sm); font-size:13px; }
  .ico:hover{ background:var(--panel3); color:var(--txt); }
  .ico.cl:hover{ background:var(--bad-soft); color:var(--bad); }

  /* ---------- corpo ---------- */
  .body{ display:flex; flex:1; min-height:0; }
  .side{ flex:0 0 220px; border-right:1px solid var(--line); background:linear-gradient(180deg,var(--shell),#090d13);
    padding:10px 9px 12px; display:flex; flex-direction:column; gap:var(--sp-2); overflow-y:auto; }
  body.side-off .side{ display:none; }
  body.side-off #btn-side{ color:var(--gold); background:var(--gold-soft); }
  .side-h{ display:flex; align-items:center; justify-content:space-between; padding:2px 4px 4px; }
  .side-h .t{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); font-weight:800; }
  .side-h .s{ font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums;
    border:1px solid var(--line); border-radius:var(--r-pill); padding:1px 7px; }
  .acc-list{ display:flex; flex-direction:column; gap:var(--sp-2); margin-top:2px; flex:1 1 auto; }

  /* card de conta */
  .acc-wrap{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r-lg);
    background:linear-gradient(165deg,var(--panel) 0%,#0e131d 100%); overflow:hidden; cursor:grab;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease), transform .16s var(--ease); }
  .acc-wrap:hover{ border-color:var(--line3); }
  .acc-wrap:active{ cursor:grabbing; }
  .acc-wrap.dragging{ opacity:.4; }
  .acc-wrap.drag-over{ border-color:var(--gold); box-shadow:0 -3px 0 var(--gold) inset; }
  .acc-wrap:has(.acc.on){ border-color:var(--gold-line); box-shadow:0 0 0 1px var(--gold-line), 0 8px 22px rgba(255,206,86,.07); }
  .acc-wrap:has(.acc.low){ border-color:var(--bad-line); box-shadow:0 0 0 1px rgba(255,107,113,.18); }
  .acc{ display:flex; flex-direction:column; align-items:stretch; gap:6px; padding:9px 10px 8px; border:0; border-radius:0;
    background:transparent; color:var(--txt); cursor:pointer; text-align:left; font-size:12.5px; font-weight:700; width:100%; }
  .acc:hover{ background:rgba(255,255,255,.022); }
  .acc.on{ background:linear-gradient(165deg,rgba(255,206,86,.09),rgba(255,206,86,.02)); }
  .acc-top{ display:flex; align-items:center; gap:5px; }
  .acc-body{ display:flex; align-items:center; gap:9px; }
  .acc-sprites{ position:relative; width:66px; height:54px; flex:0 0 66px; }
  .acc-spr{ position:absolute; right:0; bottom:0; width:54px; height:54px; object-fit:contain; image-rendering:pixelated; z-index:2;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
  .acc-spr.ph{ right:0; bottom:0; width:50px; height:50px; background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 6px, transparent 6px 12px), var(--panel2);
    border-radius:var(--r-md); border:1px dashed var(--line2); }
  .acc-spr2{ position:absolute; left:0; bottom:2px; width:36px; height:36px; object-fit:contain; image-rendering:pixelated; z-index:1; opacity:.55; filter:brightness(.72); }
  .acc-info{ min-width:0; flex:1 1 auto; display:flex; flex-direction:column; gap:3px; }
  .acc-name{ flex:1 1 auto; min-width:0; font-weight:800; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.1px; }
  .acc-sub{ font-weight:600; font-size:11px; color:var(--txt2); line-height:1.3; overflow-wrap:anywhere; }
  .acc-sub.shiny{ color:var(--gold); font-weight:800; }
  .acc-p2{ min-width:0; font-weight:400; font-size:9.5px; color:var(--dim); line-height:1.3; }
  .acc-p2-poke{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-p2 b{ color:var(--mut); font-weight:700; }
  .acc-money{ display:inline-flex; align-items:center; gap:4px; align-self:flex-start; color:var(--gold); font-size:9.5px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .acc-money img{ width:12px; height:12px; object-fit:contain; image-rendering:pixelated; }
  .acc-hunt{ display:inline-flex; align-items:center; gap:4px; align-self:flex-start; max-width:100%;
    padding:2px 7px; border:1px solid var(--line2); border-radius:var(--r-pill); background:rgba(127,180,255,.06);
    color:var(--info); font-size:9.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-slot{ flex:0 0 auto; width:16px; height:16px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--panel3); border:1px solid var(--line2); color:var(--mut); font-size:8.5px; font-weight:800; }
  .acc.on .acc-slot{ background:var(--gold-soft); border-color:var(--gold-line); color:var(--gold); }
  .acc-flag{ flex:0 0 auto; padding:1px 6px; border-radius:var(--r-pill); background:var(--good-soft); border:1px solid var(--good-line);
    color:var(--good); font-size:8px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; }
  .acc-warn{ display:block; margin-top:2px; padding:3px 7px; border-radius:var(--r-sm); background:var(--bad-soft); border:1px solid var(--bad-line);
    color:var(--bad); font-size:9px; font-weight:700; line-height:1.35; overflow-wrap:anywhere; }
  .side-empty{ padding:16px 10px; border:1px dashed var(--line2); border-radius:var(--r-md); color:var(--dim); font-size:10.5px; text-align:center; line-height:1.6; }
  .acc-reload{ flex:0 0 auto; color:var(--mut); font-size:14px; padding:2px 6px; border-radius:var(--r-sm); opacity:0; transition:opacity .12s,color .12s,background .12s; }
  .acc-wrap:hover .acc-reload{ opacity:.8; }
  .acc-reload:hover{ color:var(--warn); background:var(--panel2); opacity:1; }
  .addacc{ margin-top:2px; padding:10px; border-radius:var(--r-md); border:1px dashed var(--line2);
    background:transparent; color:var(--mut); font-size:12px; font-weight:600; width:100%; }
  .addacc:hover{ color:var(--gold); border-color:var(--gold-line); background:var(--gold-soft); }
  .gcbtn{ background:transparent; border:1px solid var(--line); color:var(--mut); border-radius:var(--r-sm); padding:6px 8px; font-size:10.5px; cursor:pointer; width:100%; text-align:center; }
  .gcbtn:hover{ background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad); }
  .game-ctrls{ display:flex; flex-direction:column; gap:5px; margin:2px 0 6px; }
  .focus-info{ font-size:10.5px; color:var(--good); padding:7px 9px; border-radius:var(--r-md);
    background:var(--good-soft); border:1px solid var(--good-line); margin-top:2px; line-height:1.45; }
  .focus-info b{ color:var(--gold); }
  .site-card-icon{ width:42px; height:42px; flex:0 0 42px; border-radius:var(--r-md); display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line2); background:var(--panel2); color:var(--gold); font-size:16px; font-weight:800; text-transform:uppercase; }
  .site-url{ font-size:9.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .site-loading{ color:var(--warn); font-size:9px; }

  /* suprimentos abaixo do card */
  .acc-items{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; padding:1px; background:var(--line); border-top:1px solid var(--line); }
  .itc{ background:#0d121b; padding:5px 3px 4px; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0; }
  .itc .top{ display:flex; align-items:center; gap:3px; }
  .itc img{ width:16px; height:16px; image-rendering:pixelated; flex:0 0 auto; }
  .itc .v{ font-size:11.5px; font-weight:800; color:var(--txt); font-variant-numeric:tabular-nums; line-height:1; }
  .itc .l{ font-size:7.5px; letter-spacing:.4px; text-transform:uppercase; color:var(--dim); font-weight:800; }
  .itc.z{ opacity:.45; }
  .itc.z .v{ color:var(--mut); }
  .itc.low{ opacity:1; background:var(--bad-soft); }
  .itc.low .v{ color:var(--bad); }
  .itc.low .l{ color:var(--bad); }

  /* ---------- diálogo de nova aba ---------- */
  .tab-dialog{ position:fixed; inset:82px 0 0; z-index:100; display:none; align-items:flex-start; justify-content:center; padding-top:70px;
    background:rgba(4,7,11,.72); backdrop-filter:blur(3px); }
  .tab-dialog.show{ display:flex; animation:fade .16s var(--ease); }
  .tab-dialog-card{ width:min(460px,calc(100vw - 36px)); padding:20px; border:1px solid var(--line2); border-radius:var(--r-xl); background:var(--panel); box-shadow:var(--sh-3); }
  .tab-dialog-card h2{ margin:0 0 6px; font-size:17px; }
  .tab-dialog-card p{ margin:0 0 14px; color:var(--mut); font-size:11.5px; line-height:1.5; }
  .tab-dialog-card input{ width:100%; height:38px; padding:0 12px; border:1px solid var(--line2); border-radius:var(--r-md); background:#0a0e16; color:var(--txt); outline:none; }
  .tab-dialog-card input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,206,86,.12); }
  .tab-dialog-error{ min-height:18px; margin-top:6px; color:var(--bad); font-size:10.5px; }
  .tab-dialog-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  .tab-dialog-actions button{ height:34px; padding:0 14px; border-radius:var(--r-sm); border:1px solid var(--line2); background:var(--panel2); color:var(--txt); }
  .tab-dialog-actions .confirm{ border-color:var(--gold-line); background:var(--gold-soft); color:var(--gold); font-weight:700; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  /* ---------- área central + casca dos painéis ---------- */
  .main{ flex:1; min-width:0; padding:12px; display:flex; align-items:center; justify-content:center; }
  .empty{ color:var(--mut); font-size:13px; text-align:center; line-height:1.7; }
  .empty b{ color:var(--gold); }
  .box-wrap{ display:flex; flex-direction:column; width:100%; height:100%; }

  /* cabeçalho comum dos painéis */
  .box-top, .bag-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:0 2px 10px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .box-top b, .bag-head b{ display:flex; align-items:center; gap:7px; font-size:14.5px; letter-spacing:.2px; }
  .box-top label, .bag-head label{ font-size:11.5px; color:var(--mut); display:flex; align-items:center; gap:5px; cursor:pointer; }
  .box-top label:hover, .bag-head label:hover{ color:var(--txt2); }
  .box-top input[type=checkbox], .bag-head input[type=checkbox]{ accent-color:var(--gold); cursor:pointer; }
  .box-top select{ background:var(--panel2); color:var(--txt); border:1px solid var(--line2); border-radius:var(--r-sm); padding:5px 8px; font-size:11.5px; outline:none; }
  .box-top select:focus{ border-color:var(--gold); }
  .box-count{ color:var(--gold); font-size:10.5px; font-weight:800; letter-spacing:.3px;
    border:1px solid var(--gold-line); background:var(--gold-soft); border-radius:var(--r-pill); padding:3px 9px; }
  .panel-hint{ color:var(--dim); font-size:10.5px; }
  .mclose{ margin-left:auto; }
  .psearch{ position:relative; display:flex; align-items:center; }
  .psearch input{ width:190px; height:29px; padding:0 10px 0 27px; border:1px solid var(--line2); border-radius:var(--r-pill);
    background:#0a0e16; color:var(--txt); font-size:11.5px; outline:none; }
  .psearch input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,206,86,.1); }
  .psearch:before{ content:"🔎"; position:absolute; left:9px; font-size:10px; opacity:.6; pointer-events:none; }
  .box-sort{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:10px 2px 4px; flex:0 0 auto; }
  .box-sort .lbl, .dex-region .lbl, .bag-tabs .lbl{ color:var(--dim); font-size:9.5px; text-transform:uppercase; letter-spacing:.7px; font-weight:800; margin-right:2px; }
  .sbtn{ background:var(--panel2); border:1px solid var(--line2); color:var(--mut); border-radius:var(--r-pill); padding:4px 12px; font-size:11px; cursor:pointer; }
  .sbtn:hover{ color:var(--txt); border-color:var(--line3); }
  .sbtn.on{ background:var(--gold); color:#191203; border-color:var(--gold); font-weight:800; }
  .box-zoom{ display:flex; align-items:center; gap:6px; color:var(--mut); font-size:12px; }
  .box-zoom input[type=range]{ width:96px; accent-color:var(--gold); cursor:pointer; }
  .box-scroll{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; margin-top:6px; }
  .panel-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:52px 16px; color:var(--mut); text-align:center; }
  .panel-empty .pe-ico{ font-size:26px; opacity:.5; }
  .panel-empty .pe-t{ color:var(--txt2); font-size:13px; font-weight:700; }
  .panel-empty .pe-s{ font-size:11px; color:var(--dim); line-height:1.6; max-width:340px; }

  /* ---------- Box ---------- */
  .box-grid{ display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; padding:4px 2px 14px; }
  .box-cell{ width:var(--cell,84px); height:var(--cell,84px); border-radius:var(--r-md); background:linear-gradient(165deg,#131a26,#0d1119);
    border:1px solid var(--line2); display:flex; flex-direction:column; align-items:center; position:relative; cursor:grab; padding:4px 3px; overflow:hidden;

  .hl-note{ font-size:9.5px; color:var(--dim); line-height:1.5; padding:2px 2px 0; }
  .hl-i{ display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px; border-radius:50%;
    border:1px solid var(--line3); color:var(--mut); font-size:8px; font-weight:800; font-style:normal; line-height:1; cursor:help;
    flex:0 0 auto; letter-spacing:0; text-transform:none; }
  .hl-i:hover{ border-color:var(--gold); color:var(--gold); }
  .hl-kpi.mid{ text-align:center; }
  .hl-kpi.mid .k{ display:flex; align-items:center; justify-content:center; gap:4px; }
  .hl-broke{ margin-top:9px; padding:10px 11px; border:1px solid var(--line); border-radius:var(--r-md); background:rgba(10,14,22,.55); }
  .hl-broke .bt{ display:flex; align-items:center; justify-content:center; gap:5px; margin-bottom:8px; color:var(--mut); font-size:8.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
  .hl-broke .bavg{ text-align:center; margin-bottom:8px; }
  .hl-broke .bavg .bn{ font-size:26px; color:var(--gold); }
  .hl-broke .bgrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; text-align:center; }
  .hl-broke .bn{ font-size:17px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
  .hl-broke .bk{ font-size:8.5px; color:var(--mut); font-weight:800; letter-spacing:.4px; text-transform:uppercase; }
  .hl-broke .max .bn{ color:var(--warn); }
  .hl-broke .min .bn{ color:var(--good); }
  .hl-broke .cur .bn{ color:var(--gold); }
  .hl-broke .bcur{ margin-top:6px; color:var(--mut); font-size:9px; text-align:center; }
  .hl-broke .bcur b{ color:var(--gold); font-size:11px; }
  .hl-broke .bacc{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .hl-broke .bar{ display:flex; align-items:baseline; gap:8px; font-size:9.5px; padding:3px 1px; }
  .hl-broke .bar .an{ color:var(--txt); font-weight:700; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hl-broke .bar .av{ color:var(--mut); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hl-broke .bar .av b{ color:var(--txt); font-weight:700; }
  .hl-ball-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .hl-ball-grid .hl-ball{ margin:0; }
  .hl-compare{ overflow:hidden; border:1px solid var(--line); border-radius:var(--r-md); background:rgba(10,14,22,.6); }
  .hl-compare-row{ display:grid; grid-template-columns:minmax(110px,1.3fr) repeat(2,minmax(105px,1fr)); gap:8px; align-items:center; padding:8px 11px; border-top:1px solid var(--line); }
  .hl-compare-row:first-child{ border-top:0; background:var(--panel3); }
  .hl-compare-row > span{ min-width:0; }
  .hl-compare-row .label{ color:var(--mut); font-size:9.5px; }
  .hl-compare-row .value{ color:var(--txt); font-size:10.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
  .hl-compare-row .value.community{ color:var(--info); }
  .hl-compare-row.head span{ color:var(--dim); font-size:8.5px; font-weight:800; text-align:right; }
  .hl-compare-row.head span:first-child{ text-align:left; }
  .hl-sample-note{ margin:8px 2px 0; color:var(--dim); font-size:8.8px; line-height:1.5; }
  .hl-account-details{ margin-top:7px; border:1px solid var(--line); border-radius:var(--r-sm); background:rgba(10,14,22,.42); }
  .hl-account-details summary{ padding:7px 9px; color:var(--mut); font-size:9px; cursor:pointer; list-style:none; }
  .hl-account-details summary::-webkit-details-marker{ display:none; }
  .hl-account-details summary:after{ content:"+"; float:right; color:var(--mut); font-weight:800; }
  .hl-account-details[open] summary:after{ content:"−"; }
  .hl-account-list{ padding:0 9px 7px; }
  .hl-account-row{ display:grid; grid-template-columns:minmax(90px,1fr) repeat(3,auto); gap:9px; padding:5px 0; border-top:1px solid var(--line); color:var(--mut); font-size:8.8px; }
  .hl-account-row b{ color:var(--txt2); font-weight:700; }
  .hl-method{ margin-top:2px; }
  .hl-method summary{ color:var(--dim); font-size:9px; cursor:pointer; }
  .hl-method p{ margin:6px 0 0; color:var(--dim); font-size:8.8px; line-height:1.55; }

  /* ---------- responsivo ---------- */
  @media (max-width:1120px){
    .psearch input{ width:140px; }
  }
  @media (max-width:620px){
    .hl-back{ padding:10px; }
    .hl-modal{ padding:15px 14px; }
    .hl-kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .hl-grid, .hl-ball-grid, .hp-grid{ grid-template-columns:1fr; }
    .hl-compare-row{ grid-template-columns:minmax(90px,1fr) repeat(2,minmax(80px,1fr)); padding-left:8px; padding-right:8px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* =========================================================================
     Poke Dream UI 2.0 — console de coleção e sessão.
     Ciano = navegação/ação; dourado = shiny/raridade; vermelho = atenção/risco.
     ========================================================================= */
  :root{
    --bg:#070b10; --shell:#090f16; --panel:#0f1722; --panel2:#14202c; --panel3:#1b2a38;
    --line:#1b2936; --line2:#2a3b4b; --line3:#3a5365;
    --txt:#eef4f7; --txt2:#bfccd5; --mut:#8394a2; --dim:#5f7180;
    --accent:#59d8c4; --accent-soft:#102925; --accent-line:#275e56;
    --gold:#f5c85d; --gold-soft:#2d2511; --gold-line:#5e4c20;
    --info:#73b9ff; --info-soft:#10243a; --info-line:#28527a;
    --good:#61d692; --good-soft:#10271b; --good-line:#2c6143;
    --warn:#f0aa5f; --warn-soft:#291d10; --warn-line:#674824;
    --bad:#f06a73; --bad-soft:#2c1419; --bad-line:#6d3039;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  }
  body{
    background:radial-gradient(900px 460px at 72% -12%,rgba(89,216,196,.07),transparent 62%),
      radial-gradient(700px 420px at -10% 108%,rgba(115,185,255,.04),transparent 64%),var(--bg);
    font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  :focus-visible{ outline-color:var(--accent); outline-offset:2px; }
  .tabbar{ background:linear-gradient(180deg,#090e14,#070b10); border-color:#17242f; }
  .site-tab{ min-width:132px; color:#728493; }
  .site-tab.on{ background:var(--panel); border-color:var(--line2); box-shadow:inset 0 2px 0 var(--accent); }
  .site-tab.drag-over{ box-shadow:-2px 0 0 var(--accent); }
  .site-tab .tab-dot{ background:radial-gradient(circle at 50% 50%,#f4f7f9 0 20%,#111820 21% 37%,transparent 38%),
      linear-gradient(#e65f6b 0 46%,#111820 46% 55%,#eef4f7 55%); box-shadow:0 0 0 1px #05080c; }
  .new-tab:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .bar{ background:linear-gradient(180deg,#101823,#0c131c); border-color:var(--line); }
  .brand{ letter-spacing:.06em; }
  .brand .logo{ background:radial-gradient(circle at 50% 50%,#f4f7f9 0 19%,#111820 20% 35%,transparent 36%),
      linear-gradient(#e65f6b 0 46%,#111820 46% 55%,#eef4f7 55%); box-shadow:0 0 0 1.5px #05080c,0 0 16px rgba(230,95,107,.14); }
  .brand b{ color:var(--accent); }
  .dream-tools{ gap:3px; padding:3px; border-color:var(--line); background:#090f16; }
  .tbtn{ color:var(--txt2); }
  .tbtn:hover{ background:var(--panel3); color:#fff; }
  .tbtn.on,.bar > .tbtn.on{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .address:focus,.psearch input:focus,.box-top select:focus,.bag-interval input:focus,.bag-keep:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(89,216,196,.1); }
  .side{ background:linear-gradient(180deg,#0a1119,#080d13); padding:12px 10px 14px; }
  body.side-off #btn-side{ color:var(--accent); background:var(--accent-soft); }
  .acc-wrap{ background:linear-gradient(155deg,#111a25,#0c131b); }
  .acc-wrap:has(.acc.on){ border-color:var(--accent-line); box-shadow:0 0 0 1px rgba(89,216,196,.15),0 10px 26px rgba(0,0,0,.22); }
  .acc.on{ background:linear-gradient(145deg,rgba(89,216,196,.1),rgba(89,216,196,.018)); }
  .acc.on .acc-slot{ background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); }
  .acc-flag{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .acc-hunt{ color:var(--info); background:var(--info-soft); border-color:var(--info-line); }
  .acc-wrap.drag-over{ border-color:var(--accent); box-shadow:0 -3px 0 var(--accent) inset; }
  .addacc:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .focus-info{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .focus-info b{ color:#a6efe3; }
  .itc{ background:#0b121a; }
  .main{ padding:14px; align-items:stretch; background:linear-gradient(145deg,rgba(89,216,196,.018),transparent 40%); }
  .empty{ margin:auto; }
  .box-wrap{ min-height:0; padding:14px; border:1px solid var(--line); border-radius:var(--r-lg);
    background:linear-gradient(155deg,rgba(20,32,44,.78),rgba(8,13,19,.92)); box-shadow:0 18px 48px rgba(0,0,0,.2); }
  .box-top,.bag-head{ min-height:42px; padding:0 0 12px; }
  .box-top b,.bag-head b{ font-size:17px; letter-spacing:-.015em; }
  .panel-icon{ width:25px; height:25px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--accent-line); border-radius:8px; background:var(--accent-soft); color:var(--accent); font-size:13px; }
  .box-count{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .psearch input{ height:32px; border-radius:10px; }
  .box-top input[type=checkbox],.bag-head input[type=checkbox],.bag-auto input{ accent-color:var(--accent); }
  .box-sort,.bag-tabs{ min-height:44px; padding:10px 0 6px; }
  .dex-order{ display:flex; align-items:center; gap:6px; }
  .sbtn{ background:#101923; }
  .sbtn.on{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line); }
  .box-zoom input[type=range]{ accent-color:var(--accent); }
  .panel-state{ min-height:180px; margin:auto; }
  .panel-state.loading .pe-ico{ width:28px; height:28px; border:2px solid var(--line3); border-top-color:var(--accent); border-radius:50%; font-size:0; animation:state-spin .8s linear infinite; }
  .panel-state.error .pe-ico{ color:var(--bad); opacity:1; font-weight:800; }
  .app-toast{ position:fixed; right:18px; bottom:18px; z-index:80; padding:9px 13px; border:1px solid var(--accent-line); border-radius:999px;
    background:#0d211e; color:var(--accent); box-shadow:var(--sh-2); font-size:10.5px; font-weight:750; opacity:0; transform:translateY(8px); pointer-events:none; transition:.18s var(--ease); }
  .app-toast.show{ opacity:1; transform:none; }
  .app-toast.error{ color:var(--bad); border-color:var(--bad-line); background:var(--bad-soft); }
  @keyframes state-spin{ to{ transform:rotate(360deg); } }

  /* Coleções grandes: PNG estático, carregamento preguiçoso e isolamento de pintura. */
  .box-cell,.dex-cell,.bag-row{ content-visibility:auto; contain:layout paint style; }
  .box-cell{ contain-intrinsic-size:auto 84px; }
  .dex-cell{ contain-intrinsic-size:auto 112px; }
  .bag-row{ contain-intrinsic-size:auto 160px; }
  .box-cell{ background:linear-gradient(155deg,#121c27,#0b121a); border-color:#253646; }
  .box-cell:hover,.dex-cell:hover{ border-color:var(--accent-line); box-shadow:0 10px 24px rgba(0,0,0,.28); }
  .box-cell:focus-visible{ border-color:var(--accent); }
  .box-cell.over{ outline-color:var(--accent); }
  .box-cell.is-shiny{ border-color:var(--gold-line); background:linear-gradient(155deg,#211c0e,#0e131a); }
  .box-cell img{ filter:drop-shadow(0 4px 7px rgba(0,0,0,.36)); }
  .box-meta{ position:absolute; left:4px; right:4px; bottom:13px; display:flex; justify-content:space-between; gap:2px; pointer-events:none; }
  .box-meta span{ max-width:48%; padding:1px 3px; border:1px solid var(--line); border-radius:4px; background:rgba(7,11,16,.86); color:var(--mut); font-size:6.5px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .box-cell .lvtag{ bottom:2px; }
  .box-cell .esstag{ bottom:4px; }
  .box-tip{ border-color:var(--accent-line); background:#101923; }
  .hl-btn:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .hl-btn{ padding:0; font-family:inherit; }
  .bag-row{ background:linear-gradient(155deg,#111a25,#0c131b); }
  .bag-row.unconfigured{ border-color:var(--bad-line); }
  .bag-row.rare{ border-color:var(--gold-line); background:linear-gradient(155deg,#201b0f,#0e151d 70%); }
  .bag-row.locked{ border-color:var(--warn-line); }
  .bag-icon{ color:var(--accent); background:radial-gradient(circle at 50% 34%,#1b2d39,#0d141c 74%); }
  .bag-note b{ color:var(--accent); }
  .bag-lock{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .bag-account{ background:#101923; }

  .hl-back{ background:rgba(3,7,10,.79); backdrop-filter:blur(8px); }
  .hl-modal{ width:min(920px,100%); padding:22px 24px 20px; border-color:var(--line3); background:linear-gradient(155deg,#111b26,#0b1118); }
  .hl-h{ position:sticky; top:-22px; z-index:5; margin:-22px -24px 18px; padding:18px 24px 14px; background:rgba(12,18,26,.95); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
  .hl-badge.live{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .hl-badge.sample{ margin-left:auto; color:var(--txt2); border-color:var(--line3); background:var(--panel3); text-transform:none; letter-spacing:0; }
  .hl-kpi,.hl-panel,.hl-ball,.hl-community{ background:#0a1118; }
  .hl-kpi:not(.gold){ border-color:#243543; }
  .hl-live.on .dot{ background:var(--accent); }
  .hl-i:hover{ border-color:var(--accent); color:var(--accent); }
  .hl-account-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:8px; }
  .hl-account-card{ padding:11px 12px; border:1px solid var(--line); border-radius:var(--r-md); background:#0a1118; }
  .ac-head{ display:flex; align-items:center; gap:8px; padding-bottom:7px; border-bottom:1px solid var(--line); }
  .ac-head b{ min-width:0; flex:1; color:var(--txt); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ac-head span{ color:var(--mut); font-size:9px; }
  .ac-metrics{ display:flex; flex-wrap:wrap; gap:8px 12px; padding:8px 0 5px; color:var(--mut); font-size:9px; }
  .ac-metrics b{ color:var(--txt2); font-size:11px; }
  .ac-metrics .gold b{ color:var(--gold); }
  .ac-foot{ color:var(--dim); font-size:8.8px; }

  /* Análise de captura: uma história contínua, com poucos blocos e hierarquia clara. */
  .hl-story-head{ display:grid; grid-template-columns:52px minmax(0,1fr) auto auto; align-items:center; gap:12px; margin-bottom:9px; }
  .hl-story-avatar{ width:52px; height:52px; display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid var(--gold-line); border-radius:50%; background:var(--gold-soft); }
  .hl-story-avatar img{ width:48px; height:48px; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(0 5px 8px rgba(0,0,0,.38)); }
  .hl-story-title{ min-width:0; }
  .hl-story-title h2{ margin:0; color:var(--txt); font-size:24px; line-height:1.05; letter-spacing:-.035em; }
  .hl-story-title p{ margin:4px 0 0; color:var(--mut); font-size:9.5px; }
  .hl-story-time{ padding:5px 11px; border:1px solid var(--line2); border-radius:999px; color:var(--mut); font-size:9px; white-space:nowrap; }
  .hl-story-close{ width:28px; height:28px; border:1px solid var(--line2); border-radius:9px; background:transparent; color:var(--mut); cursor:pointer; }
  .hl-story-close:hover{ color:var(--bad); border-color:var(--bad-line); background:var(--bad-soft); }
  .hl-story-hero{ padding:23px 0 21px; border-bottom:1px solid var(--line); }
  .hl-story-eyebrow{ color:var(--mut); font-size:8.5px; font-weight:850; letter-spacing:1.15px; text-transform:uppercase; }
  .hl-story-number{ margin-top:8px; color:var(--gold); font-size:56px; font-weight:900; line-height:.96; letter-spacing:-.065em; font-variant-numeric:tabular-nums; }
  .hl-story-number span{ color:#767e88; font-weight:760; }
  .hl-story-explain{ margin:12px 0 0; color:var(--mut); font-size:10.5px; line-height:1.55; }
  .hl-story-explain b{ color:var(--txt2); }
  .hl-story-kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; margin-top:21px; }
  .hl-story-kpi{ min-width:0; }
  .hl-story-kpi b{ display:block; color:var(--txt); font-size:20px; line-height:1.05; font-variant-numeric:tabular-nums; }
  .hl-story-kpi.gold b{ color:var(--gold); }
  .hl-story-kpi span{ display:block; margin-top:5px; color:var(--mut); font-size:9px; line-height:1.35; }
  .hl-story-section{ margin-top:25px; }
  .hl-story-section-title{ display:flex; align-items:baseline; gap:9px; margin-bottom:10px; color:var(--txt2); font-size:8.5px; font-weight:850; letter-spacing:.9px; text-transform:uppercase; }
  .hl-story-section-title small{ color:var(--mut); font-size:9px; font-weight:500; letter-spacing:0; text-transform:none; }
  .hl-now-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .hl-now{ padding:14px 16px; border:1px solid var(--line); border-radius:var(--r-lg); background:#101720; }
  .hl-now-top{ display:flex; align-items:baseline; gap:10px; color:var(--txt2); font-size:10.5px; }
  .hl-now-top b{ margin-left:auto; color:var(--txt); font-size:16px; font-variant-numeric:tabular-nums; }
  .hl-now-top small{ color:var(--mut); font-size:8.5px; }
  .hl-now-track{ height:5px; margin-top:11px; overflow:hidden; border-radius:999px; background:#1a232d; }
  .hl-now-fill{ display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#d99d00,var(--gold)); transition:width .2s var(--ease); }
  .hl-now.record{ border-color:var(--gold-line); background:linear-gradient(145deg,rgba(45,37,17,.82),#101720 72%); }
  .hl-now.record .hl-now-fill{ background:linear-gradient(90deg,var(--gold),#fff0a6); box-shadow:0 0 12px rgba(245,200,93,.34); }
  .hl-now.record .hl-now-note{ color:var(--gold); }
  .hl-now-note{ margin-top:7px; color:var(--dim); font-size:8.8px; }
  .hl-story-compare{ padding:5px 16px; border:1px solid var(--line); border-radius:var(--r-lg); background:#101720; }
  .hl-story-compare-row{ padding:12px 0; border-top:1px solid var(--line); }
  .hl-story-compare-row:first-child{ border-top:0; }
  .hl-story-compare-top{ margin-bottom:8px; }
  .hl-story-compare-top .label{ color:var(--txt2); font-size:10px; }
  .hl-story-pair{ display:grid; grid-template-columns:64px 70px minmax(0,1fr); align-items:center; gap:8px; margin-top:6px; }
  .hl-story-pair .who{ color:var(--mut); font-size:8.5px; }
  .hl-story-pair .value{ color:var(--txt); font-size:10px; font-weight:800; font-variant-numeric:tabular-nums; }
  .hl-story-pair.community .who,.hl-story-pair.community .value{ color:var(--info); }
  .hl-story-track{ height:5px; overflow:hidden; border-radius:999px; background:#18212b; }
  .hl-story-fill{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--good)); }
  .hl-story-fill.community{ background:linear-gradient(90deg,#397ebd,var(--info)); }
  .hl-story-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin:8px 0 0; color:var(--mut); font-size:8.5px; }
  .hl-story-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .hl-story-legend i{ width:13px; height:3px; border-radius:999px; background:var(--good); }
  .hl-story-legend i.community{ background:var(--info); }
  .hl-story-broke{ padding:16px 18px; border:1px solid var(--line); border-radius:var(--r-lg); background:#101720; }
  .hl-story-broke-main b{ display:block; color:var(--gold); font-size:26px; line-height:1; font-variant-numeric:tabular-nums; }
  .hl-story-broke-main span{ display:block; margin-top:5px; color:var(--mut); font-size:8.5px; }
  .hl-story-broke-track{ position:relative; height:4px; margin:19px 2px 10px; border-radius:999px; background:#1b242e; }

<script>
  const P = window.poke || null;
  let accounts = [];

  let accInfo = {};   // { slot: { name, hunt, species, level } } — vem do main pela rede do jogo
  let browserState = { tabs:[{ id:'dream', kind:'dream', title:'PokeDream', fixed:true, count:0 }], activeTabId:'dream', maxTabs:4, active:{ kind:'dream' } };

  function panelState(icon, title, text, kind){
    return '<div class="panel-empty panel-state'+(kind ? ' '+kind : '')+'"><div class="pe-ico">'+icon+'</div>'
      + '<div class="pe-t">'+esc(title)+'</div><div class="pe-s">'+esc(text)+'</div></div>';

  function setToolState(id, on){
    const button = document.getElementById(id); if (!button) return;

  }

  function isDreamTab(){ return !browserState.active || browserState.active.kind === 'dream'; }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function titce(s){ return String(s||'').replace(/_/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); }); }
  // nome (grafia do pokedream) -> nº da dex nacional, pra usar o sprite ANIMADO (gen-V) do PokeAPI
  const DEX_MAP = {"Bulbasaur":1,"Ivysaur":2,"Venusaur":3,"Charmander":4,"Charmeleon":5,"Charizard":6,"Squirtle":7,"Wartortle":8,"Blastoise":9,"Caterpie":10,"Metapod":11,"Butterfree":12,"Weedle":13,"Kakuna":14,"Beedrill":15,"Pidgey":16,"Pidgeotto":17,"Pidgeot":18,"Rattata":19,"Raticate":20,"Spearow":21,"Fearow":22,"Ekans":23,"Arbok":24,"Pikachu":25,"Raichu":26,"Sandshrew":27,"Sandslash":28,"NidoranF":29,"Nidorina":30,"Nidoqueen":31,"NidoranM":32,"Nidorino":33,"Nidoking":34,"Clefairy":35,"Clefable":36,"Vulpix":37,"Ninetales":38,"Jigglypuff":39,"Wigglytuff":40,"Zubat":41,"Golbat":42,"Oddish":43,"Gloom":44,"Vileplume":45,"Paras":46,"Parasect":47,"Venonat":48,"Venomoth":49,"Diglett":50,"Dugtrio":51,"Meowth":52,"Persian":53,"Psyduck":54,"Golduck":55,"Mankey":56,"Primeape":57,"Growlithe":58,"Arcanine":59,"Poliwag":60,"Poliwhirl":61,"Poliwrath":62,"Abra":63,"Kadabra":64,"Alakazam":65,"Machop":66,"Machoke":67,"Machamp":68,"Bellsprout":69,"Weepinbell":70,"Victreebel":71,"Tentacool":72,"Tentacruel":73,"Geodude":74,"Graveler":75,"Golem":76,"Ponyta":77,"Rapidash":78,"Slowpoke":79,"Slowbro":80,"Magnemite":81,"Magneton":82,"Farfetchd":83,"Doduo":84,"Dodrio":85,"Seel":86,"Dewgong":87,"Grimer":88,"Muk":89,"Shellder":90,"Cloyster":91,"Gastly":92,"Haunter":93,"Gengar":94,"Onix":95,"Drowzee":96,"Hypno":97,"Krabby":98,"Kingler":99,"Voltorb":100,"Electrode":101,"Exeggcute":102,"Exeggutor":103,"Cubone":104,"Marowak":105,"Hitmonlee":106,"Hitmonchan":107,"Lickitung":108,"Koffing":109,"Weezing":110,"Rhyhorn":111,"Rhydon":112,"Chansey":113,"Tangela":114,"Kangaskhan":115,"Horsea":116,"Seadra":117,"Goldeen":118,"Seaking":119,"Staryu":120,"Starmie":121,"MrMime":122,"Scyther":123,"Jynx":124,"Electabuzz":125,"Magmar":126,"Pinsir":127,"Tauros":128,"Magikarp":129,"Gyarados":130,"Lapras":131,"Ditto":132,"Eevee":133,"Vaporeon":134,"Jolteon":135,"Flareon":136,"Porygon":137,"Omanyte":138,"Omastar":139,"Kabuto":140,"Kabutops":141,"Aerodactyl":142,"Snorlax":143,"Dratini":147,"Dragonair":148,"Dragonite":149,"Chikorita":152,"Bayleef":153,"Meganium":154,"Cyndaquil":155,"Quilava":156,"Typhlosion":157,"Totodile":158,"Croconaw":159,"Feraligatr":160,"Sentret":161,"Furret":162,"Hoothoot":163,"Noctowl":164,"Ledyba":165,"Ledian":166,"Spinarak":167,"Ariados":168,"Crobat":169,"Chinchou":170,"Lanturn":171,"Pichu":172,"Cleffa":173,"Igglybuff":174,"Togepi":175,"Togetic":176,"Natu":177,"Xatu":178,"Mareep":179,"Flaaffy":180,"Ampharos":181,"Bellossom":182,"Marill":183,"Azumarill":184,"Sudowoodo":185,"Politoed":186,"Hoppip":187,"Skiploom":188,"Jumpluff":189,"Aipom":190,"Sunkern":191,"Sunflora":192,"Yanma":193,"Wooper":194,"Quagsire":195,"Espeon":196,"Umbreon":197,"Murkrow":198,"Slowking":199,"Misdreavus":200,"Unown":201,"Wobbuffet":202,"Girafarig":203,"Pineco":204,"Forretress":205,"Dunsparce":206,"Gligar":207,"Steelix":208,"Snubbull":209,"Granbull":210,"Qwilfish":211,"Scizor":212,"Shuckle":213,"Heracross":214,"Sneasel":215,"Teddiursa":216,"Ursaring":217,"Slugma":218,"Magcargo":219,"Swinub":220,"Piloswine":221,"Corsola":222,"Remoraid":223,"Octillery":224,"Delibird":225,"Mantine":226,"Skarmory":227,"Houndour":228,"Houndoom":229,"Kingdra":230,"Phanpy":231,"Donphan":232,"Porygon2":233,"Stantler":234,"Smeargle":235,"Tyrogue":236,"Hitmontop":237,"Smoochum":238,"Elekid":239,"Magby":240,"Miltank":241,"Blissey":242,"Larvitar":246,"Pupitar":247,"Tyranitar":248};
  function spr(name, shiny){ const d = name && DEX_MAP[name]; return d ? 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/' + (shiny ? 'shiny/' : '') + d + '.gif' : ''; }
  // sprite ESTATICO (png) — usado na box, que pode ter milhares de pokes (gif animado travaria)
  function sprStatic(name, shiny){ const d = name && DEX_MAP[name]; return d ? 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + (shiny ? 'shiny/' : '') + d + '.png' : ''; }
  // raridade (essence) -> rank pra ordenar
  const ESS_RANK = { 'comum':0, 'incomum':1, 'raro':2, 'ultra raro':3, 'lendario':4, 'lendário':4, 'legendary':4, 'mitico':5, 'mítico':5, 'mythic':5 };
  function essRank(e){ if (e == null) return -1; const v = ESS_RANK[String(e).toLowerCase().trim()]; return v != null ? v : -1; }
  function dexNum(name){ const d = name && DEX_MAP[name]; return d || 0; }

  // ---- box unificada (grid de todos os pokes das 4 contas, arrastável) ----
  let boxOpen = false, boxData = null, boxRows = [], boxSort = 'dex', boxDir = 1, boxShiny = false, boxAcc = '', boxOrder = null, boxTipEl = null, boxQuery = '';
  let boxZoom = (function(){ const v = parseInt(localStorage.getItem('boxZoom'), 10); return (v >= 56 && v <= 128) ? v : 84; })();

  function flattenBox(data){
    const rows = [];
    for (const acc of (data || [])) for (const p of (acc.pokes || [])) {
      rows.push({ uid: p.uid, species: p.species, level: p.level, potential: p.potential, essence: p.essence, shiny: !!p.shiny, stored: p.stored, account: acc.name, slot: acc.slot });
    }
    return rows;
  }
  function keyOf(r){ return r.slot + ':' + r.uid; }
  function sortRows(rows, key, dir){
    const val = (r) => key === 'potential' ? (r.potential || 0)
      : key === 'level' ? (r.level || 0)
      : key === 'rarity' ? essRank(r.essence)
      : key === 'dex' ? (dexNum(r.species) || 9999)
      : String(r.species || '').toLowerCase();
    return rows.slice().sort((a, b) => { const x = val(a), y = val(b); if (typeof x === 'string') return x.localeCompare(y) * dir; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  }
  function loadOrder(){ try { return JSON.parse(localStorage.getItem('boxOrder') || 'null'); } catch { return null; } }
  function saveOrder(arr){ try { localStorage.setItem('boxOrder', JSON.stringify(arr)); } catch {} }
  function ensureOrder(){
    const keys = boxRows.map(keyOf), set = new Set(keys);
    let order = loadOrder();
    if (order && order.length){
      order = order.filter(k => set.has(k));           // tira o que não existe mais
      const have = new Set(order);
      keys.forEach(k => { if (!have.has(k)) order.push(k); }); // adiciona pokes novos no fim
      boxSort = null;                                   // ordem custom salva -> nenhum botão ativo
    } else {
      boxSort = 'dex'; boxDir = 1;
      order = sortRows(boxRows, 'dex', 1).map(keyOf);
    }
    boxOrder = order; saveOrder(order);
  }

  function ensureTip(){ if (!boxTipEl){ boxTipEl = document.createElement('div'); boxTipEl.className = 'box-tip'; document.body.appendChild(boxTipEl); } return boxTipEl; }
  function showTip(r){ if (!r) return; const t = ensureTip();
    t.innerHTML = '<div class="tn'+(r.shiny?' box-shiny':'')+'">' + esc(r.species) + (r.shiny ? ' ✨' : '') + '</div>'
      + '<div class="tr">Nível <b>' + (r.level != null ? r.level : '-') + '</b></div>'
      + '<div class="tr">IV <b>' + (r.potential != null ? r.potential + '%' : '-') + '</b></div>'
      + (r.essence ? '<div class="tr">Raridade <b>' + esc(r.essence) + '</b></div>' : '')
      + '<div class="tr">Origem <b>' + esc(r.account) + '</b></div>'
      + (r.stored === true ? '<div class="tr">Estado <b>Guardado na Box</b></div>' : '');
    t.style.display = 'block';
  }
  function moveTip(e){ if (!boxTipEl || boxTipEl.style.display === 'none') return; const pad = 14; let x = e.clientX + pad, y = e.clientY + pad; const w = boxTipEl.offsetWidth, h = boxTipEl.offsetHeight; if (x + w > window.innerWidth) x = e.clientX - w - pad; if (y + h > window.innerHeight) y = e.clientY - h - pad; boxTipEl.style.left = x + 'px'; boxTipEl.style.top = y + 'px'; }
  function hideTip(){ if (boxTipEl) boxTipEl.style.display = 'none'; }

  function moveInOrder(from, to){
    const a = boxOrder.slice(); const fi = a.indexOf(from); if (fi < 0) return;
    a.splice(fi, 1); const ti = a.indexOf(to); a.splice(ti < 0 ? a.length : ti, 0, from);
    boxOrder = a; saveOrder(a); boxSort = null; setSortActive(); renderBoxGrid();
  }
  function matchesBoxQuery(r, q){
    if (!q) return true;
    const d = dexNum(r.species);
    return String(r.species || '').toLowerCase().indexOf(q) >= 0
      || String(r.essence || '').toLowerCase().indexOf(q) >= 0
      || String(r.account || '').toLowerCase().indexOf(q) >= 0
      || (d ? String(d).padStart(3, '0').indexOf(q) >= 0 : false);
  }
  function renderBoxGrid(){
    const grid = document.getElementById('box-grid'); if (!grid) return;
    grid.style.setProperty('--cell', boxZoom + 'px');
    const q = boxQuery.trim().toLowerCase();
    const byKey = {}; boxRows.forEach(r => byKey[keyOf(r)] = r);
    const vis = boxOrder.map(k => byKey[k]).filter(r => r && (!boxShiny || r.shiny) && (!boxAcc || String(r.slot) === boxAcc) && matchesBoxQuery(r, q));
    grid.innerHTML = vis.length ? vis.map(function(r){
      const s = sprStatic(r.species, r.shiny);
      const d = dexNum(r.species);
      const num = d ? '#' + String(d).padStart(3, '0') : '';
      const ess = essRank(r.essence);
      const label = r.species+'; '+num+'; nível '+(r.level != null ? r.level : 'indisponível')+'; potencial '+(r.potential != null ? r.potential+'%' : 'indisponível')+'; conta '+r.account+(r.shiny ? '; shiny' : '');
      return '<div class="box-cell'+(r.shiny?' is-shiny':'')+'" draggable="true" data-key="'+esc(keyOf(r))+'" tabindex="0" role="listitem" aria-label="'+esc(label)+'">'
        + '<button type="button" class="hl-btn" data-sp="'+esc(r.species)+'" title="Histórico de caçada" aria-label="Abrir histórico de '+esc(r.species)+'">+</button>'
        + '<span class="box-num">' + num + '</span>'
        + (s ? '<img src="'+s+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '')
        + '<span class="box-name'+(r.shiny?' shiny':'')+'">' + esc(r.species) + '</span>'
        + '<span class="box-meta"><span title="Conta de origem: '+esc(r.account)+'">T'+esc(r.slot)+'</span>'
          + (r.potential != null ? '<span title="Potencial">IV '+esc(r.potential)+'%</span>' : '')+'</span>'
        + (r.shiny ? '<span class="sh">✨</span>' : '')
        + (ess >= 0 ? '<span class="esstag ess-'+ess+'" title="'+esc(titce(r.essence))+'"></span>' : '')
        + (r.level != null ? '<span class="lvtag">Lv '+esc(r.level)+'</span>' : '')
        + '</div>';
    }).join('')
      : (boxRows.length
        ? '<div class="panel-empty"><div class="pe-ico">🔍</div><div class="pe-t">Nenhum pokémon com esses filtros</div>'
          + '<div class="pe-s">Ajuste a busca, o filtro de shiny ou a conta selecionada para ver o restante da box.</div></div>'
        : '<div class="panel-empty"><div class="pe-ico">📦</div><div class="pe-t">Box vazia</div>'
          + '<div class="pe-s">Abra uma tela e entre em uma conta: os pokémon aparecem aqui conforme o jogo envia o estado.</div></div>');
    const c = document.getElementById('box-count'); if (c) c.textContent = vis.length + ' pokémon';


    // Delegação mantém uma quantidade constante de listeners mesmo com milhares de cards.
    let dragKey = null;
    const eventCell = function(event){ return event.target && event.target.closest ? event.target.closest('.box-cell') : null; };
    grid.ondragstart = function(e){ const cell = eventCell(e); if (!cell) return; dragKey = cell.dataset.key; cell.classList.add('dragging'); hideTip(); if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain',dragKey); } catch {} } };
    grid.ondragend = function(e){ const cell = eventCell(e); if (cell) cell.classList.remove('dragging'); grid.querySelectorAll('.over').forEach(function(item){ item.classList.remove('over'); }); };
    grid.ondragover = function(e){ if (!eventCell(e)) return; e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; };
    grid.ondragenter = function(e){ const cell = eventCell(e); if (cell && cell.dataset.key !== dragKey) cell.classList.add('over'); };
    grid.ondragleave = function(e){ const cell = eventCell(e); if (cell && !cell.contains(e.relatedTarget)) cell.classList.remove('over'); };
    grid.ondrop = function(e){ const cell = eventCell(e); if (!cell) return; e.preventDefault(); cell.classList.remove('over'); const from = dragKey || (e.dataTransfer && e.dataTransfer.getData('text/plain')); const to = cell.dataset.key; if (from && to && from !== to) moveInOrder(from,to); };
    grid.onmouseover = function(e){ const cell = eventCell(e); if (cell && !cell.contains(e.relatedTarget)) showTip(byKey[cell.dataset.key]); };
    grid.onmousemove = moveTip;
    grid.onmouseout = function(e){ const cell = eventCell(e); if (cell && !cell.contains(e.relatedTarget)) hideTip(); };
  }
  function setSortActive(){ const wrap = document.querySelector('.box-sort'); if (!wrap) return; wrap.querySelectorAll('.sbtn').forEach(b => b.classList.toggle('on', b.dataset.k === boxSort)); }
  function applySort(){ boxOrder = sortRows(boxRows, boxSort, boxDir).map(keyOf); saveOrder(boxOrder); setSortActive(); renderBoxGrid(); }
  function renderBox(){
    const main = document.getElementById('main');
    const accOpts = '<option value="">Todas as contas</option>' + (boxData || []).map(function(a){ return '<option value="'+a.slot+'">'+esc(a.name)+'</option>'; }).join('');
    main.innerHTML =
      '<div class="box-wrap">'
        + '<div class="box-top">'

  function huntPerformanceHTML(sp, d, loadError, loading){

        + (buffControls ? '<div class="hp-buffs" data-hp-raw-xp="'+Number(r.xpPerHour)+'">'+buffControls+'<span class="hp-buff-note">clique para remover do valor</span></div>' : '')+'</div>'
        + '<div class="hp-poke">'+(pokeSprite ? '<img src="'+pokeSprite+'" alt="'+pokeName+'" onerror="this.style.display=\'none\'">' : '<span class="fallback">◌</span>')
        + '<div><div class="name'+(poke && poke.shiny ? ' shiny' : '')+'">'+(poke && poke.shiny ? '✨ ' : '')+pokeName+'</div><div class="level">'+level+'</div></div></div>'
        + '<div class="hp-meta"><b>'+esc(r.trainerName || 'Treinador não informado')+'</b> · '+fmtDur(Number(r.ms) || 0)+' de hunt<br>Salvo em '+esc(saved)
        + '<div class="hp-cross"><span>XP/h<b'+(spec.key === 'xpPerHour' ? ' data-hp-xp-ref' : '')+'>'+fmtInt(r.xpPerHour == null ? null : Math.round(Number(r.xpPerHour)))+'</b></span>'

          + '<span class="score"><span'+(key === 'xpPerHour' ? ' data-hp-xp-value' : '')+'>'+fmtInt(Math.round(Number(r.score)))+'</span><small>'+unit+'</small></span>'

    const communityBlock = d.communityError
      ? '<div class="hl-empty local">O top 3 da comunidade não pôde ser consultado agora.</div>'
      : '<div class="hp-rankings">'+rankColumn('xpPerHour','Top 3 · XP/h','XP/h','xp')+rankColumn('mobsPerHour','Top 3 · mobs/h','mobs/h','mobs')+'</div>';

  function updatePerformanceBuffValue(button){
    const card = button && button.closest ? button.closest('.hp-card') : null;
    const buffs = card && card.querySelector('.hp-buffs');
    if (!card || !buffs) return;
    let value = Number(buffs.dataset.hpRawXp);
    if (!Number.isFinite(value)) return;
    buffs.querySelectorAll('[data-hp-buff][aria-pressed="false"]').forEach(function(buff){
      const rate = Number(buff.dataset.hpBuffRate);
      if (Number.isFinite(rate) && rate > 0) value /= 1 + rate;
    });
    card.querySelectorAll('[data-hp-xp-value],[data-hp-xp-ref]').forEach(function(node){ node.textContent = fmtInt(Math.round(value)); });
  }
  function openHuntLog(sp){
    if (!sp) return;
    hideTip(); closeHuntLog(); hlReturnFocus = document.activeElement;
    hlBack = document.createElement('div');
    hlBack.className = 'hl-back';
    hlBack.innerHTML = '<div class="hl-modal" role="dialog" aria-modal="true" aria-label="Histórico de '+esc(sp)+'" tabindex="-1">'+panelState('◌','Carregando histórico','Reunindo o histórico local e a amostra da comunidade.','loading')+'</div>';
    document.body.appendChild(hlBack);
    const back = hlBack;
    let activeHubTab = 'capture';
    let captureData = null, captureError = false;
    let performanceData = null, performanceError = false, performanceRequested = false, performanceLoading = false;
    const bindControls = function(){
      const x = back.querySelector('#hl-x');
      if (x) x.onclick = closeHuntLog;
    };
    const showCapture = function(){
      if (hlBack !== back || !back.isConnected) return;
      back.querySelector('.hl-modal').innerHTML = huntHubHTML(sp, captureData, captureError);
      bindControls();
    };
    const showPerformance = function(loading){
      if (hlBack !== back || !back.isConnected) return;
      back.querySelector('.hl-modal').innerHTML = huntPerformanceHTML(sp, performanceData, performanceError, loading);
      bindControls();
    };
    back.addEventListener('click', function(e){
      if (e.target === back) { closeHuntLog(); return; }
      const buff = e.target.closest && e.target.closest('[data-hp-buff]');
      if (buff) {
        e.preventDefault();
        buff.setAttribute('aria-pressed', buff.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        updatePerformanceBuffValue(buff);
        return;
      }
      const tab = e.target.closest && e.target.closest('[data-hub-tab]');
      if (!tab) return;
      activeHubTab = tab.dataset.hubTab;
      if (activeHubTab === 'capture') { showCapture(); return; }
      if (performanceRequested) { showPerformance(performanceLoading); return; }
      performanceRequested = true;
      performanceLoading = true;
      showPerformance(true);
      if (P && P.getHuntPerformance) P.getHuntPerformance(sp).then(function(d){
        performanceData = d; performanceLoading = false;
        if (activeHubTab === 'records') showPerformance(false);
      }).catch(function(){
        performanceError = true; performanceLoading = false;
        if (activeHubTab === 'records') showPerformance(false);
      });
      else { performanceError = true; performanceLoading = false; showPerformance(false); }
    });
    document.addEventListener('keydown', hlEsc);
    back.querySelector('.hl-modal').focus();
    const fill = function(d, loadError){
      if (hlBack !== back || !back.isConnected) return;
      captureData = d; captureError = loadError;
      showCapture();
      const x = back.querySelector('#hl-x'); if (x) x.focus();
    };
    if (P && P.getHuntLog) P.getHuntLog(sp).then(function(d){ fill(d, false); }).catch(function(){ fill(null, true); });
    else fill(null, true);
  }
  // liga os "+" (delegação: funciona pra Box, Pokédex e Stats sem religar a cada render)

  // ---- Suprimentos de cada conta, logo abaixo do card: mini-cards (linha 1 = balls, linha 2 = pot/revive) ----
  // [chave, label, sprite do item na PokeAPI]. Vem no payload de 'accounts'.
  const ITM_DEFS = [
    ['poke_ball','Poke','poke-ball'], ['ultra_ball','Ultra','ultra-ball'], ['premier_ball','Prem','premier-ball'],
    ['potion','Potion','potion'], ['revive','Revive','revive'],
  ];
  let itemVis = { poke_ball: true, ultra_ball: true, premier_ball: true, potion: true, revive: true };   // config (menu ⚙ > Itens)
  let itemAlert = { poke_ball: 2000, ultra_ball: 2000, premier_ball: 2000, potion: 2000, revive: 500 };  // limite p/ borda vermelha (0 = off)
  function sprItem(name){ return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/' + name + '.png'; }
  function abbrN(n){ n = n || 0; if (n >= 1e6) return (n/1e6).toFixed(1).replace('.',',') + 'M'; if (n >= 1e3) return (n/1e3).toFixed(1).replace('.',',') + 'k'; return String(n); }
  function isLow(key, v){ const t = itemAlert[key] || 0; return t > 0 && (v || 0) < t; }   // abaixo do limite configurado
  // itens visíveis que estão baixos numa conta -> usados pra borda vermelha do card + tooltip
  function accLowItems(inf){
    const it = inf && inf.items; if (!it) return [];
    return ITM_DEFS.filter(function(c){ return itemVis[c[0]] !== false && isLow(c[0], it[c[0]]); }).map(function(c){ return c[1]; });
  }
  function itemsForAcc(inf){
    const it = inf && inf.items; if (!it) return '';
    const defs = ITM_DEFS.filter(function(c){ return itemVis[c[0]] !== false; });
    if (!defs.length) return '';
    const cards = defs.map(function(c){
      const v = it[c[0]] || 0, lo = isLow(c[0], v);
      return '<div class="itc'+(v?'':' z')+(lo?' low':'')+'" title="'+c[1]+': '+v.toLocaleString('pt-BR')+(lo?' — baixo!':'')+'">'
        + '<span class="top"><img src="'+sprItem(c[2])+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"><span class="v">'+abbrN(v)+'</span></span>'

  function renderTabs(){

    }).join('');

      tabEl.addEventListener('click', function(){ if (P && P.selectSiteTab) P.selectSiteTab(tabEl.dataset.tab); });

      tabEl.addEventListener('dragstart', function(e){ tabEl.classList.add('dragging'); if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',tabEl.dataset.tab); } });
      tabEl.addEventListener('dragend', function(){ tabEl.classList.remove('dragging'); root.querySelectorAll('.drag-over').forEach(function(el){el.classList.remove('drag-over');}); });
      tabEl.addEventListener('dragover', function(e){ e.preventDefault(); tabEl.classList.add('drag-over'); });
      tabEl.addEventListener('dragleave', function(){ tabEl.classList.remove('drag-over'); });
      tabEl.addEventListener('drop', function(e){
        e.preventDefault(); tabEl.classList.remove('drag-over');
        const from = e.dataTransfer && e.dataTransfer.getData('text/plain'), to = tabEl.dataset.tab;
        if (!from || from === to) return;
        const order = (browserState.tabs || []).filter(function(t){return !t.fixed;}).map(function(t){return t.id;});

      });
    });
    root.querySelectorAll('[data-close-tab]').forEach(function(btn){ btn.onclick=function(e){ e.stopPropagation(); if(P&&P.closeSiteTab)P.closeSiteTab(btn.dataset.closeTab); }; });
  }

      card.ondrop=function(e){e.preventDefault();card.classList.remove('drag-over');const from=dragSlot!=null?dragSlot:+(e.dataTransfer&&e.dataTransfer.getData('text/plain')),to=+card.dataset.wrap;if(!from||from===to)return;const order=slots.slice(),fi=order.indexOf(from);if(fi<0)return;order.splice(fi,1);const ti=order.indexOf(to);order.splice(ti<0?order.length:ti,0,from);if(P&&P.reorderViews)P.reorderViews(order);};
    });
    const add=side.querySelector('[data-action="add"]'); if(add)add.onclick=function(){if(P)P.addView();};
    const remove=side.querySelector('[data-action="remove"]'); if(remove)remove.onclick=function(){if(slots.length&&P)P.removeView(slots[slots.length-1]);};
    const grid=document.getElementById('btn-grid');
    grid.style.display=active.mode==='single'?'':'none'; grid.classList.toggle('on',active.mode==='single');
    document.getElementById('main').innerHTML=slots.length?'':'<div class="empty">Nenhuma sessão aberta.<br>Clique em <b>+ Adicionar tela</b> para começar.</div>';
  }

  function applyBrowserState(next){
    if(next&&next.tabs)browserState=next;
    const generic=!isDreamTab(); document.body.classList.toggle('generic-active',generic);
    if (generic && tasksOpen){ closeTasksState(); if (P && P.setBoxOpen) P.setBoxOpen(false); }
    renderTabs();
    document.getElementById('btn-add').textContent=generic?'+ Adicionar sessão':'+ Adicionar tela';
    const active=browserState.active||{};
    const address=document.getElementById('address'); if(generic&&document.activeElement!==address)address.value=active.address||active.homeUrl||'';
    document.getElementById('btn-back').disabled=!active.canGoBack;
    document.getElementById('btn-forward').disabled=!active.canGoForward;
    renderSidebar();
  }

  function renderSidebar() {
    if (!isDreamTab()) { renderGenericSidebar(); return; }
    const side = document.getElementById('side');
    const btnGrid = document.getElementById('btn-grid');

    const accHTML = accounts.map(s => {
      const isSel = mode === 'single' && selected === s;
      const inf = accInfo[s] || {};
      const name = inf.name || ('Tela ' + s);
      const a = inf.active, p2 = inf.party2;
      const front = a
        ? '<img class="acc-spr" src="'+spr(a.species, a.shiny)+'" onerror="this.classList.add(\'ph\');this.removeAttribute(\'src\')">'
        : '<span class="acc-spr ph"></span>';
      const back = p2 ? '<img class="acc-spr2" src="'+spr(p2.species, p2.shiny)+'" title="2º da party" onerror="this.style.display=\'none\'">' : '';
      const sprites = '<span class="acc-sprites">' + back + front + '</span>';
      const sub = a ? (esc(a.species) + ' Lv' + a.level) : 'carregando…';   // shiny já fica dourado, não precisa de emote
      const money = Number(inf.items && inf.items.money || 0);
      const p2line = p2 ? '<span class="acc-p2"><span class="acc-p2-poke" title="2º pokémon da party">'+esc(p2.species)+(p2.level != null ? ' <b>Lv'+Number(p2.level)+'</b>' : '')+'</span></span>' : '';
      const moneyline = '<span class="acc-money" title="Dinheiro da conta: '+money.toLocaleString('pt-BR')+' gold"><img src="https://pokedream.com.br/items/gold.png" alt="" loading="lazy" onerror="this.remove()"><span>'+abbrN(money)+' gold</span></span>';
      const hunt = inf.hunt ? '<span class="acc-hunt" title="caçando ' + esc(titce(inf.hunt)) + '">🗺 ' + esc(titce(inf.hunt)) + '</span>' : '';
      const low = accLowItems(inf);
      const card = '<button class="acc'+(isSel?' on':'')+(low.length?' low':'')+'" data-slot="'+s+'"'+(low.length?' title="⚠ Item baixo: '+esc(low.join(', '))+'"':'')+'>'
        + '<span class="acc-top"><span class="acc-slot" title="Tela '+s+'">'+s+'</span>'+'<span class="acc-name">'+esc(name)+'</span>'
          + (isSel ? '<span class="acc-flag" title="Tela em foco">foco</span>' : '')
          + '<span class="acc-reload" data-reload="'+s+'" title="Recarregar">&#x21bb;</span></span>'
        + '<span class="acc-body">' + sprites
          + '<span class="acc-info"><span class="acc-sub'+(a&&a.shiny?' shiny':'')+'">'+sub+'</span>'+p2line+moneyline+hunt+'</span>'
        + '</span>'
        + (low.length ? '<span class="acc-warn">⚠ Item baixo: '+esc(low.join(', '))+'</span>' : '')
        + '</button>';
      // o wrap inteiro (card + itens) é o alvo do arrastar — senão o bloco de itens vira zona morta
      return '<div class="acc-wrap" draggable="true" data-wrap="'+s+'">' + card + itemsForAcc(inf) + '</div>';
    }).join('');

    const focusHTML = mode === 'single' && selected
      ? '<div class="focus-info">&#x1f50d; Foco na <b>Tela '+selected+'</b><br>Clique nela de novo ou em "Grade" para voltar ao grid.</div>'
      : '';

    const html = [
      '<div class="side-h"><span class="t">Telas</span><span class="s">'+accounts.length+'/4</span></div>',
      '<div class="acc-list">' + (accHTML || '<div class="side-empty">Nenhuma tela aberta ainda.</div>') + '</div>',
      focusHTML,
      accounts.length < 4 ? '<button class="addacc" data-action="add">+ Adicionar tela</button>' : '',
      accounts.length > 0 ? '<div class="game-ctrls"><button class="gcbtn" data-action="remove">✕ Fechar ultima tela</button></div>' : '',
    ].join('');
    side.innerHTML = html;

    // fiação por addEventListener (sem onclick inline no HTML)
    side.querySelectorAll('[data-slot]').forEach(b => b.addEventListener('click', () => { if (boxOpen) toggleBox(false); if (bagOpen) toggleBag(false); if (dexOpen) toggleDex(false); if (tasksOpen) toggleTasks(false); if (P) P.selectAccount(+b.dataset.slot); }));
    side.querySelectorAll('[data-reload]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); if (P) P.reloadGame(+b.dataset.reload); }));

    // arrastar os cards pra reordenar as contas (reordena as telas do jogo junto)
    let dragSlot = null;
    side.querySelectorAll('.acc-wrap').forEach(function(card){
      card.addEventListener('dragstart', function(e){ dragSlot = +card.dataset.wrap; card.classList.add('dragging'); if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragSlot)); } catch {} } });
      card.addEventListener('dragend', function(){ card.classList.remove('dragging'); side.querySelectorAll('.acc-wrap.drag-over').forEach(c => c.classList.remove('drag-over')); });
      card.addEventListener('dragover', function(e){ e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; });
      card.addEventListener('dragenter', function(){ if (+card.dataset.wrap !== dragSlot) card.classList.add('drag-over'); });
      // só tira o realce ao sair do bloco de vez (passar do card pros itens não conta)
      card.addEventListener('dragleave', function(e){ if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over'); });
      card.addEventListener('drop', function(e){
        e.preventDefault(); card.classList.remove('drag-over');
        const from = dragSlot != null ? dragSlot : (e.dataTransfer && +e.dataTransfer.getData('text/plain'));
        const to = +card.dataset.wrap;
        if (from == null || Number.isNaN(from) || from === to) return;
        const order = accounts.slice();
        const fi = order.indexOf(from); if (fi < 0) return;
        order.splice(fi, 1);
        const ti = order.indexOf(to); order.splice(ti < 0 ? order.length : ti, 0, from);
        if (P && P.reorderViews) P.reorderViews(order);   // main reordena as telas e reenvia o payload -> re-render
      });
    });
    const addBtn = side.querySelector('[data-action="add"]'); if (addBtn) addBtn.addEventListener('click', () => { if (P) P.addView(); });
    const rmBtn = side.querySelector('[data-action="remove"]'); if (rmBtn) rmBtn.addEventListener('click', removeLast);

    // mostra/esconde botao de Grade
    if (mode === 'single') {
      btnGrid.style.display = '';
      btnGrid.classList.add('on');
    } else {
      btnGrid.style.display = 'none';
      btnGrid.classList.remove('on');
    }

    // enquanto um painel principal está aberto ele ocupa o #main — não mexer
    if (!boxOpen && !bagOpen && !dexOpen && !tasksOpen) {
      document.getElementById('main').innerHTML = accounts.length
        ? ''
        : '<div class="empty">Nenhuma tela aberta.<br>Clique em <b>+ Adicionar tela</b> para começar.</div>';
    }
  }

  if (P) {
    P.onAccounts(function(payload) {
      accounts = (payload && payload.slots) ? payload.slots : [];
      selected = (payload && payload.selected) ? payload.selected : null;
      mode = (payload && payload.mode) ? payload.mode : 'grid';
      accInfo = (payload && payload.info) ? payload.info : {};
      renderSidebar();
    });
    if (P.onBrowserState) P.onBrowserState(applyBrowserState);
    if (P.getBrowserState) P.getBrowserState().then(applyBrowserState);
  }

  document.getElementById('btn-add').onclick = function() { if (P) P.addView(); };
  document.getElementById('btn-box').onclick = function() { toggleBox(); };
  document.getElementById('btn-bag').onclick = function() { toggleBag(); };
  document.getElementById('btn-dex').onclick = function() { toggleDex(); };
  document.getElementById('btn-tasks').onclick = function() { toggleTasks(); };
  document.getElementById('btn-stats').onclick = function() {
    if (bagOpen) closeBagState();
    if (boxOpen){ boxOpen = false; setToolState('btn-box', false); }
    if (dexOpen){ dexOpen = false; setToolState('btn-dex', false); }
    if (tasksOpen) closeTasksState();
    if (!P || !P.toggleXpPanel) return;
    const ready = P.setBoxOpen ? P.setBoxOpen(false) : Promise.resolve();
    Promise.resolve(ready).then(function(){ return P.toggleXpPanel(); }).then(function(state){
      setToolState('btn-stats', !!(state && state.open));
    });
  };
  document.getElementById('btn-grid').onclick = function() { if (boxOpen) toggleBox(false); if (bagOpen) toggleBag(false); if (dexOpen) toggleDex(false); if (tasksOpen) toggleTasks(false); if (P) P.setGameMode('grid'); };
  document.getElementById('btn-min').onclick = function() { if (P) P.winMinimize(); };
  document.getElementById('btn-max').onclick = function() { if (P) P.winMaximize(); };
  document.getElementById('btn-close').onclick = function() { if (P) P.winClose(); };

  // ---- versao (na barra) + botao de config (abre o overlay proprio, por cima do jogo) ----
  if (P && P.getVersion) P.getVersion().then(function(v) {
    document.getElementById('app-ver').textContent = 'v' + v;
  });
  document.getElementById('btn-cfg').onclick = function() { if (P && P.toggleConfig) P.toggleConfig(); };
  document.getElementById('btn-side').onclick = function() {
    const off = document.body.classList.toggle('side-off');
    if (P && P.setSidebar) P.setSidebar(off);
  };

  const tabDialog=document.getElementById('tab-dialog'), tabUrl=document.getElementById('tab-url'), tabError=document.getElementById('tab-dialog-error');
  function setTabDialog(open){
    tabDialog.classList.toggle('show',!!open); tabError.textContent='';
    if(P&&P.setTabDialogOpen)P.setTabDialogOpen(!!open);
    if(open){tabUrl.value='';setTimeout(function(){tabUrl.focus();},0);}
  }
  document.getElementById('btn-new-tab').onclick=function(){if(!this.disabled)setTabDialog(true);};
  document.getElementById('tab-cancel').onclick=function(){setTabDialog(false);};
  document.getElementById('tab-dialog-form').onsubmit=function(e){
    e.preventDefault(); tabError.textContent='';
    if(!P||!P.addSiteTab)return;
    P.addSiteTab(tabUrl.value).then(function(result){if(result&&result.ok)setTabDialog(false);else tabError.textContent=result&&result.error||'Não foi possível abrir o site.';});
  };
  tabDialog.onclick=function(e){if(e.target===tabDialog)setTabDialog(false);};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&tabDialog.classList.contains('show'))setTabDialog(false);});

  document.getElementById('btn-back').onclick=function(){if(P&&P.navigateSite)P.navigateSite('back');};
  document.getElementById('btn-forward').onclick=function(){if(P&&P.navigateSite)P.navigateSite('forward');};
  document.getElementById('btn-reload-site').onclick=function(){if(P&&P.navigateSite)P.navigateSite('reload');};
  document.getElementById('btn-home-site').onclick=function(){if(P&&P.navigateSite)P.navigateSite('home');};
  document.getElementById('address-form').onsubmit=function(e){
    e.preventDefault(); const address=document.getElementById('address');
    if(P&&P.navigateSite)P.navigateSite('url',address.value).then(function(state){
      if(state&&state.error){address.setCustomValidity(state.error);address.reportValidity();address.setCustomValidity('');}
      else applyBrowserState(state);
    });
  };

  renderSidebar();
  renderTabs();

  function removeLast() {
    if (accounts.length > 0 && P) P.removeView(accounts[accounts.length - 1]);
  }

  // ---- som ao capturar shiny (a dashView é dona da reprodução; toca mesmo com o config fechado) ----
  let sndEnabled = true, sndVolume = 0.8, sndAudio = null;
  function playSound(dataUrl, volume) {
    const url = dataUrl || (sndAudio && sndAudio.src);
    if (!url) return;
    try { const a = new Audio(url); a.volume = Math.max(0, Math.min(1, volume != null ? volume : sndVolume)); a.play().catch(function(){}); } catch {}
  }
  if (P && P.onSoundConfig) P.onSoundConfig(function(cfg){
    if (!cfg) return;
    sndEnabled = cfg.enabled !== false;
    if (typeof cfg.volume === 'number') sndVolume = cfg.volume;
    if (cfg.dataUrl) { sndAudio = new Audio(cfg.dataUrl); }   // pré-carrega o áudio atual
  });
  if (P && P.onItemConfig) P.onItemConfig(function(p){ if (!p) return; if (p.vis) itemVis = p.vis; if (p.alert) itemAlert = p.alert; renderSidebar(); });   // menu ⚙ > Itens: visibilidade + limite de alerta
  if (P && P.onShinyCaught) P.onShinyCaught(function(){ if (sndEnabled) playSound(null, sndVolume); });
  if (P && P.onPlaySound) P.onPlaySound(function(p){ playSound(p && p.dataUrl, p && p.volume); });   // botão testar (ignora o enabled)
</script>
</body>
</html>
