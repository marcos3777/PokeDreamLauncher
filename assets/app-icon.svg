<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Poke Dream Launcher</title>
  <defs>
    <clipPath id="ball">
      <circle cx="256" cy="256" r="218"/>
    </clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#00070d" flood-opacity=".52"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#e65f6b" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g clip-path="url(#ball)">
      <rect x="38" y="38" width="436" height="200" fill="#e65f6b"/>
      <rect x="38" y="238" width="436" height="44" fill="#111820"/>
      <rect x="38" y="282" width="436" height="192" fill="#eef4f7"/>
    </g>
    <circle cx="256" cy="256" r="218" fill="none" stroke="#05080c" stroke-width="18"/>
    <circle cx="256" cy="256" r="82" fill="#111820"/>
    <circle cx="256" cy="256" r="43" fill="#f4f7f9" stroke="#05080c" stroke-width="9"/>
  </g>
</svg>
