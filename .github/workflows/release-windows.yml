name: Release Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { "found=true" >> $env:GITHUB_OUTPUT } else { "found=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Test release announcements
        run: node --test .github/scripts/release-announcement.test.cjs

      - name: Validate player release notes
        id: notes
        if: steps.existing.outputs.found != 'true'
        run: node .github/scripts/release-notes.cjs

      - name: Install dependencies
        if: steps.existing.outputs.found != 'true'
        run: npm ci

      - name: Build installer
        if: steps.existing.outputs.found != 'true'
        run: npm run dist

      - name: Publish release
        id: publish
        if: steps.existing.outputs.found != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "dist/Poke-Dream-Launcher-Windows-x64.exe" `
            "dist/Poke-Dream-Launcher-Windows-x64.exe.blockmap" `
            "dist/latest.yml" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Poke Dream Launcher ${{ steps.version.outputs.tag }}" `
            --notes-file "$env:RELEASE_NOTES_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "published=true" >> $env:GITHUB_OUTPUT

  notify-discord:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Send player update to Discord
        uses: actions/github-script@v7
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        with:
          script: |
            const { notify } = require('./.github/scripts/notify-discord.cjs');
            await notify({ github, context, core });
